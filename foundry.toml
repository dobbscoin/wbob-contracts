[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.27"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1000
max_test_rejects = 65536

[profile.default.invariant]
runs = 500
depth = 100
call_override = false

[profile.ci]
fuzz = { runs = 5000 }
invariant = { runs = 1000, depth = 200 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[doc]
out = "docs"
